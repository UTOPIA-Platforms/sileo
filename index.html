<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTOPIA Sileo Repo</title>
<style>
  body { background:#0d0d12; color:#eee; font-family:-apple-system,system-ui,sans-serif;
         margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width:560px; padding:40px 24px; text-align:center; }
  h1 { font-size:28px; margin:0 0 8px; }
  .sub { color:#9a9aad; margin-bottom:28px; }
  code { display:block; background:#1a1a22; border:1px solid #333; border-radius:10px;
         padding:14px; font-size:15px; word-break:break-all; color:#b79cff; }
  a.btn { display:inline-block; margin-top:20px; background:#7C4DFF; color:#fff;
          text-decoration:none; padding:14px 28px; border-radius:12px; font-weight:600; }
  .hint { margin-top:16px; color:#666; font-size:13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>UTOPIA Repo</h1>
    <div class="sub">Sileo · rootless tweaks</div>
    <code>https://utopia-platforms.github.io/sileo/</code>
    <a class="btn" href="sileo://source/https://utopia-platforms.github.io/sileo/">Add to Sileo</a>
    <div class="hint">or: Sileo → Sources → Edit → Add → paste the URL</div>
  </div>
</body>
</html>
